[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-fastload"
version = "0.1.0"
description = "Decode LeRobot videos once and train from a uint8 frame cache in RAM and VRAM"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "lerobot>=0.4.2,<0.5",
    "numpy",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
fastload-build-cache = "fastload.build_cache:main"
fastload-train = "fastload.train:main"
fastload-supervise = "fastload.supervise:main"

[tool.setuptools.packages.find]
where = ["src"]
